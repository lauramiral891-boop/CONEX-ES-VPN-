name: Android CI / CD - Compilação Automática do APK Conexões VPN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android Oficial
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js para Construção da Interface Web
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar Dependências e Compilar Bundle Web
        run: |
          npm ci
          npm run build
          mkdir -p android/app/src/main/assets/dist
          rm -rf android/app/src/main/assets/dist/*
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Assets web embutidos no APK com sucesso:"
          ls -la android/app/src/main/assets/dist/

      - name: 4. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 5. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Permissões de Execução do Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 7. Compilar APK de Depuração (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 8. Publicar Artefato do APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: conexoes-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
